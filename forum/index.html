<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabernacle — Lil Message</title>
  <meta name="description" content="Tabernacle, the Lil Message forum. Talk about the records and everything around them." />
  <!-- People may talk about leaving high-control groups here, so stay out of search results. -->
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 ws://127.0.0.1:54321; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <link rel="icon" type="image/png" href="../assets/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #080808;
      --deep: #0d0d0d;
      --card: #111111;
      --border: #222222;
      --gold: #c9a84c;
      --gold-dim: #7a6228;
      --gold-text: #9a7f3d;
      --fog: #2a2a2a;
      --white: #f0ece4;
      --muted: #8f8f87;
      --red: #8b1a1a;
      --red-text: #d0645c;
      --mono: 'Space Mono', monospace;
      --display: 'Cinzel Decorative', serif;
      --serif: 'Crimson Pro', Georgia, serif;
      color-scheme: dark;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--serif);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.4;
    }
    a { color: inherit; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    h1:focus { outline: none; }
    ::selection { background: var(--gold); color: var(--black); }

    /* Loading line */
    .progress {
      position: fixed; top: 0; left: 0; right: 0; height: 1px; z-index: 200;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      background-size: 40% 100%; background-repeat: no-repeat;
      opacity: 0; transition: opacity 0.2s ease;
    }
    .progress.on { opacity: 1; animation: sweep 1.1s ease-in-out infinite; }
    @keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }

    /* Top bar */
    .bar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 1.5rem;
      padding: 0.9rem clamp(1rem, 4vw, 2rem);
      background: rgba(8,8,8,0.82);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      view-transition-name: bar;
    }
    .bar-home {
      font-family: var(--display); font-weight: 700; font-size: 0.85rem;
      color: var(--gold); text-decoration: none; letter-spacing: 0.04em; white-space: nowrap;
    }
    .bar-links { display: flex; align-items: center; gap: 1.25rem; margin-left: auto; }
    .bar-link {
      font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color 0.2s ease; white-space: nowrap;
    }
    .bar-link:hover, .bar-link[aria-current="page"] { color: var(--white); }
    .bar-me { display: inline-flex; align-items: center; gap: 0.5rem; text-transform: none; letter-spacing: 0.04em; font-size: 0.7rem; }

    /* Buttons, from the main site */
    .btn {
      display: inline-block;
      font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase;
      text-decoration: none; padding: 0.85rem 1.75rem; border: 1px solid;
      transition: color 0.3s ease, border-color 0.3s ease, opacity 0.2s ease;
      position: relative; overflow: hidden; white-space: nowrap;
    }
    .btn::before { content: ''; position: absolute; inset: 0; transform: translateX(-101%); transition: transform 0.3s ease; }
    .btn:hover::before { transform: translateX(0); }
    .btn > span { position: relative; z-index: 1; }
    .btn-primary { background: var(--gold); border-color: var(--gold); color: var(--black); }
    .btn-primary::before { background: var(--white); }
    .btn-ghost { border-color: var(--fog); color: var(--muted); }
    .btn-ghost::before { background: var(--card); }
    .btn-ghost:hover { color: var(--white); }
    .btn-danger { background: var(--red); border-color: var(--red); color: var(--white); }
    .btn-danger::before { background: #a82424; }
    .btn-sm { padding: 0.55rem 1rem; font-size: 0.6rem; }
    .btn[disabled] { opacity: 0.5; cursor: wait; }
    .quiet {
      font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); padding: 0.25rem 0; transition: color 0.2s ease; text-decoration: none;
    }
    .quiet:hover { color: var(--gold); }
    .quiet.danger:hover { color: var(--red-text); }

    main { flex: 1; width: 100%; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 2rem); }
    .read { max-width: 720px; margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 2rem); }
    .enter > * { animation: fadeUp 0.6s ease both; }
    .enter > *:nth-child(2) { animation-delay: 0.06s; }
    .enter > *:nth-child(3) { animation-delay: 0.12s; }

    .eyebrow {
      font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--gold-text); text-decoration: none;
    }
    a.eyebrow:hover { color: var(--gold); }

    /* Forum home */
    .masthead {
      position: relative; text-align: center; overflow: hidden;
      padding: clamp(4rem, 11vw, 7.5rem) 1.5rem clamp(3rem, 8vw, 5rem);
      border-bottom: 1px solid var(--border);
    }
    .masthead::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 55% at 50% 70%, rgba(139,26,26,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 80% 70% at 50% 110%, rgba(201,168,76,0.07) 0%, transparent 60%);
    }
    .masthead > * { position: relative; }
    .masthead h1 {
      font-family: var(--display); font-weight: 900; line-height: 1; letter-spacing: -0.02em;
      font-size: clamp(3rem, 11vw, 7rem); margin-top: 1.5rem;
      text-shadow: 0 0 80px rgba(201,168,76,0.15), 0 2px 4px rgba(0,0,0,0.8);
    }
    .masthead-rule { width: 1px; height: 56px; margin: 2rem auto; background: linear-gradient(to bottom, transparent, var(--gold-dim), transparent); }
    .masthead p {
      font-style: italic; font-weight: 300; color: var(--muted);
      font-size: clamp(1.05rem, 2.4vw, 1.35rem); line-height: 1.6; max-width: 560px; margin: 0 auto;
    }

    .block { padding: clamp(3rem, 8vw, 5rem) 0 0; }
    .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }

    /* Boards: album covers */
    .general {
      display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
      padding: 1.75rem; margin-bottom: 1px; text-decoration: none;
      background: var(--deep); border: 1px solid var(--border);
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    .general:hover { background: var(--card); border-color: var(--gold-dim); }
    .general-name { font-family: var(--display); font-weight: 700; font-size: 1.35rem; }
    .general-desc { color: var(--muted); font-weight: 300; font-style: italic; font-size: 1.05rem; margin-top: 0.25rem; }
    .count { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-text); white-space: nowrap; }
    .covers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-top: 0; }
    .cover { position: relative; display: block; aspect-ratio: 1 / 1; overflow: hidden; background: var(--card); text-decoration: none; }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.9s cubic-bezier(.2,.7,.2,1), filter 0.5s ease; filter: saturate(0.82) brightness(0.8); }
    .cover:hover img, .cover:focus-visible img { transform: scale(1.05); filter: saturate(1) brightness(0.95); }
    .cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0.35) 45%, transparent 70%); pointer-events: none; }
    .cover-text { position: absolute; left: 1.1rem; right: 1.1rem; bottom: 1rem; z-index: 1; display: flex; flex-direction: column; gap: 0.4rem; }
    .cover-name { font-family: var(--display); font-weight: 700; font-size: 1rem; line-height: 1.2; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }
    .cover:focus-visible { outline-offset: -3px; }

    /* Thread rows use the tracklist look */
    .rows { border-top: 1px solid var(--border); }
    .row {
      display: grid; grid-template-columns: 2rem 1fr auto; align-items: baseline; gap: 0.25rem 1rem;
      padding: 1.1rem 0; border-bottom: 1px solid var(--border); text-decoration: none;
      transition: padding-left 0.2s ease, background 0.2s ease;
    }
    .row:hover { padding-left: 0.5rem; }
    .row-num { font-family: var(--mono); font-size: 0.6rem; color: var(--gold-text); }
    .row-title { font-size: 1.15rem; line-height: 1.35; overflow-wrap: anywhere; transition: color 0.2s ease; }
    .row:hover .row-title { color: var(--gold); }
    .row-replies { font-family: var(--mono); font-size: 0.6rem; color: var(--muted); white-space: nowrap; }
    .row-meta { grid-column: 2 / -1; font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.06em; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 0.6rem; }
    .row-meta > * + *::before { content: '·'; margin-right: 0.6rem; color: var(--fog); }
    .row-meta .gold { color: var(--gold-text); }

    /* Board page */
    .board-hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
    .board-glow { position: absolute; inset: -30%; width: 160%; height: 160%; object-fit: cover; filter: blur(70px) saturate(1.2); opacity: 0.32; pointer-events: none; }
    .board-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, var(--black)); pointer-events: none; }
    .board-inner { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: clamp(1.25rem, 4vw, 2.5rem); padding-top: clamp(2.5rem, 7vw, 4.5rem); padding-bottom: clamp(2rem, 5vw, 3rem); }
    .board-art { width: clamp(96px, 22vw, 200px); aspect-ratio: 1 / 1; object-fit: cover; flex: none; box-shadow: 0 18px 60px rgba(0,0,0,0.7); outline: 1px solid rgba(201,168,76,0.35); outline-offset: 1px; }
    .board-info { min-width: 0; flex: 1; }
    .board-info h1 { font-family: var(--display); font-weight: 900; font-size: clamp(1.7rem, 5.5vw, 3.4rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0.75rem 0; overflow-wrap: anywhere; }
    .board-info p { font-style: italic; font-weight: 300; color: var(--muted); font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.55; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.75rem 0 1.25rem; }
    .empty { padding: clamp(3rem, 9vw, 5rem) 1rem; text-align: center; color: var(--muted); font-style: italic; font-weight: 300; font-size: 1.2rem; }
    .empty .btn { margin-top: 1.5rem; font-style: normal; }
    .more { display: flex; justify-content: center; padding: 2rem 0 0; }

    /* Thread page */
    .thread-head { padding: clamp(2.5rem, 7vw, 4.5rem) 0 2rem; }
    .thread-head h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 4.6vw, 2.7rem); line-height: 1.15; margin-top: 1rem; overflow-wrap: anywhere; }
    .post { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 1rem; padding: 1.75rem 0; border-top: 1px solid var(--border); scroll-margin-top: 5rem; transition: background 0.6s ease; }
    .post-opening { border-top: 0; padding-top: 0; }
    .post-opening .post-body { font-size: 1.28rem; line-height: 1.7; }
    .post.fresh { animation: fadeUp 0.5s ease both; }
    .post:target { background: linear-gradient(90deg, rgba(201,168,76,0.09), transparent 70%); box-shadow: -1rem 0 0 rgba(201,168,76,0.09); }
    .post-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; margin-bottom: 0.5rem; font-family: var(--mono); }
    .post-author { font-size: 0.74rem; color: var(--white); overflow-wrap: anywhere; }
    .post-time, .post-num { font-size: 0.58rem; color: var(--muted); text-decoration: none; }
    .post-num { margin-left: auto; color: var(--gold-text); }
    .post-num:hover { color: var(--gold); }
    .tag { font-size: 0.5rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 0.12rem 0.4rem; border: 1px solid var(--gold-dim); color: var(--gold); }
    .tag-mod { background: var(--gold); border-color: var(--gold); color: var(--black); }
    .post-body { font-size: 1.15rem; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .post-actions { display: flex; gap: 1rem; margin-top: 0.6rem; opacity: 0.55; transition: opacity 0.2s ease; }
    .post:hover .post-actions, .post:focus-within .post-actions { opacity: 1; }
    .sigil { display: block; flex: none; color: var(--gold); }

    /* Writing */
    .composer { border: 1px solid var(--border); background: var(--deep); transition: border-color 0.25s ease, box-shadow 0.25s ease; }
    .composer:focus-within { border-color: var(--gold-dim); box-shadow: 0 0 40px rgba(201,168,76,0.05); }
    .composer textarea, .composer input {
      display: block; width: 100%; background: none; border: 0; outline: 0; color: var(--white);
      font-family: var(--serif); font-size: 1.15rem; line-height: 1.6; padding: 1.1rem 1.25rem;
    }
    .composer textarea { min-height: 7.5rem; resize: none; overflow: hidden; }
    .composer input { font-family: var(--display); font-weight: 700; font-size: 1.25rem; border-bottom: 1px solid var(--border); }
    .composer ::placeholder { color: #66665f; font-style: italic; font-weight: 300; }
    .composer input::placeholder { font-family: var(--serif); font-size: 1.15rem; }
    .composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.7rem 0.7rem 0.7rem 1.25rem; border-top: 1px solid var(--border); }
    .composer-hint { font-family: var(--mono); font-size: 0.56rem; letter-spacing: 0.06em; color: var(--muted); }
    .composer-hint.over { color: var(--red-text); }
    .reply-area { padding: 2rem 0 0; border-top: 1px solid var(--border); }
    .reply-label { display: block; margin-bottom: 1rem; }

    /* Dialogs */
    dialog {
      margin: auto; width: min(460px, calc(100vw - 2rem)); max-height: calc(100dvh - 2rem);
      background: var(--deep); color: var(--white); border: 1px solid var(--fog); padding: 2rem;
      box-shadow: 0 30px 100px rgba(0,0,0,0.8);
    }
    dialog[open] { animation: fadeUp 0.3s ease both; }
    dialog::backdrop { background: rgba(4,4,4,0.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    dialog h2 { font-family: var(--display); font-weight: 700; font-size: 1.4rem; line-height: 1.2; margin-bottom: 0.75rem; }
    dialog p { color: var(--muted); font-size: 1.05rem; line-height: 1.55; font-weight: 300; }
    .field { display: block; margin-top: 1.25rem; }
    .field > span { display: block; font-family: var(--mono); font-size: 0.56rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-text); margin-bottom: 0.5rem; }
    .field input, .field textarea {
      width: 100%; background: var(--black); border: 1px solid var(--fog); color: var(--white);
      font-family: var(--serif); font-size: 1.1rem; padding: 0.7rem 0.85rem; outline: 0; transition: border-color 0.2s ease;
    }
    .field input:focus, .field textarea:focus { border-color: var(--gold); }
    .check { display: flex; gap: 0.7rem; align-items: flex-start; margin-top: 1.25rem; color: var(--muted); font-size: 1.02rem; line-height: 1.45; cursor: pointer; }
    .check input { accent-color: var(--gold); width: 1rem; height: 1rem; margin-top: 0.25rem; flex: none; }
    .check a { color: var(--gold); }
    .dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.75rem; margin-top: 1.75rem; }
    .name-preview { display: flex; align-items: center; gap: 1rem; margin-top: 1.25rem; min-height: 56px; padding: 0.5rem 0; }
    .name-preview b { font-family: var(--mono); font-weight: 400; font-size: 0.85rem; overflow-wrap: anywhere; }
    .sent-sigil { color: var(--gold); margin-bottom: 1.25rem; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 1rem); z-index: 2000;
      max-width: calc(100vw - 2rem); width: max-content;
      font-family: var(--mono); font-size: 0.7rem; line-height: 1.5;
      background: var(--white); color: var(--black); padding: 0.7rem 1.1rem;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
    .toast.bad { background: var(--red); color: var(--white); }

    /* Text pages */
    .page-head { padding: clamp(2.5rem, 7vw, 4.5rem) 0 2rem; }
    .page-head h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1.1; margin-top: 1rem; overflow-wrap: anywhere; }
    .prose { font-size: 1.15rem; line-height: 1.7; font-weight: 300; }
    .prose h2 { font-family: var(--mono); font-weight: 400; font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold-text); margin: 2.5rem 0 1rem; }
    .prose ul { list-style: none; border-top: 1px solid var(--border); }
    .prose li { padding: 0.8rem 0; border-bottom: 1px solid var(--border); }
    .prose p + p { margin-top: 1rem; }
    .prose a { color: var(--gold); }
    .notice { border-left: 1px solid var(--gold-dim); padding-left: 1.25rem; color: var(--muted); font-style: italic; }
    .banner { background: var(--red); color: var(--white); text-align: center; font-family: var(--mono); font-size: 0.68rem; padding: 0.6rem 1rem; line-height: 1.5; }
    .identity { display: flex; align-items: center; gap: 1.25rem; }
    .identity .sigil { flex: none; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; padding: 1.25rem 0; border-top: 1px solid var(--border); }
    .settings-row:last-child { border-bottom: 1px solid var(--border); }
    .settings-row strong { font-weight: 400; display: block; font-size: 1.1rem; }
    .settings-row small { color: var(--muted); font-size: 0.98rem; font-weight: 300; line-height: 1.45; display: block; margin-top: 0.15rem; overflow-wrap: anywhere; }

    /* Moderation */
    .report { border-top: 1px solid var(--border); padding: 1.5rem 0; }
    .report-why { font-size: 1.15rem; margin: 0.5rem 0 0.75rem; overflow-wrap: anywhere; }
    .report-excerpt { border-left: 1px solid var(--fog); padding-left: 1rem; color: var(--muted); font-weight: 300; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    .report-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }

    footer { margin-top: clamp(4rem, 10vw, 7rem); padding: 3rem 2rem; text-align: center; border-top: 1px solid var(--border); view-transition-name: foot; }
    .footer-name { font-family: var(--display); font-size: 0.9rem; color: var(--gold-dim); letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .footer-copy { font-family: var(--mono); font-size: 0.55rem; letter-spacing: 0.15em; color: #5a5a55; text-transform: uppercase; }

    @media (max-width: 600px) {
      .bar { gap: 0.75rem; }
      .bar-links { gap: 0.9rem; }
      .bar-rules { display: none; }
      .bar-me span { max-width: 6.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .covers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cover:last-child:nth-child(odd) { grid-column: span 2; aspect-ratio: 2 / 1; }
      .cover-name { font-size: 0.82rem; }
      .cover-text { left: 0.75rem; right: 0.75rem; bottom: 0.7rem; }
      .general { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
      .post { grid-template-columns: 30px minmax(0, 1fr); gap: 0 0.75rem; }
      .post-actions { opacity: 1; }
      .post-opening .post-body { font-size: 1.18rem; }
      .settings-row { flex-direction: column; align-items: flex-start; }
      .composer-hint-keys { display: none; }
      dialog { padding: 1.5rem; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
